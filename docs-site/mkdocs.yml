site_name: VBS Customer Success Academy
site_description: Customer Success Knowledge Base
site_author: Sharad Puri

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - Academy:
      - Modules: modules.md
      - SOP Library: sops.md
      - Email Templates: emails.md
      - Meeting Templates: meetings.md
  - Standards: standards.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
